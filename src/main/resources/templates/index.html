<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Comparateur de PDF</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        h1 { color: #333; }
        form { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .alert { padding: 10px; margin-bottom: 15px; border-radius: 4px; }
        .alert-success { background: #d4edda; color: #155724; }
        .alert-danger { background: #f8d7da; color: #721c24; }
        table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background-color: #007bff; color: white; }
    </style>
</head>
<body>

<h1>Application de Comparaison de PDF</h1>

<!-- Formulaire de saisie des répertoires -->
<form action="#" th:action="@{/compare}" method="post">
    <div class="form-group">
        <label for="refDir">Dossier de Référence :</label>
        <input type="text" id="refDir" name="refDir" required placeholder="Ex: C:/Dossiers/Ref">
    </div>
    <div class="form-group">
        <label for="testDir">Dossier Cible (Test) :</label>
        <input type="text" id="testDir" name="testDir" required placeholder="Ex: C:/Dossiers/Test">
    </div>
    <div class="form-group">
        <label for="regex">Expression Régulière (Regex) :</label>
        <input type="text" id="regex" name="regex" value=".*?-([0-9]{6})-?">
    </div>
    <button type="submit">Lancer la Comparaison</button>
</form>

<!-- Message d'information ou d'erreur -->
<div th:if="${message}" class="alert" th:classappend="${success} ? 'alert-success' : 'alert-danger'">
    <p th:text="${message}"></p>
</div>

<!-- Tableau des résultats -->
<div th:if="${comparisonResults != null and !comparisonResults.isEmpty()}">
    <h2>Résultats de la Comparaison</h2>
    <table>
        <thead>
            <tr>
                <th>Identifiant</th>
                <th>Fichier Référence</th>
                <th>Fichier Cible</th>
                <th>Statut</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="entry : ${comparisonResults}">
                <td th:text="${entry.key.identifier}">ID</td>
                <td th:text="${entry.key.refPdf.name}">ref.pdf</td>
                <td th:text="${entry.key.testPdf.name}">test.pdf</td>
                <td th:text="${entry.value.status}">Statut</td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
